<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
margin: 0;
height: 100vh;
background: linear-gradient(135deg, #ff9a9e, #fad0c4);
font-family: 'Segoe UI', sans-serif;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}

.popup, .final-page {
background: white;
padding: 25px;
border-radius: 20px;
text-align: center;
box-shadow: 0 20px 40px rgba(0,0,0,0.2);
width: 90%;
max-width: 360px;
}

h1, h2 {
color: #ff4d6d;
}

p {
color: #444;
font-size: 16px;
}

.buttons {
margin-top: 25px;
position: relative;
height: 120px;
}

button {
padding: 14px 30px;
border: none;
border-radius: 30px;
font-size: 16px;
cursor: pointer;
position: absolute;
transition: all 0.2s ease;
}

#yes {
background: #ff4d6d;
color: white;
left: 50%;
transform: translateX(-50%);
bottom: 0;
}

#no {
background: #ddd;
color: #333;
left: 50%;
transform: translateX(-50%);
top: 0;
}

.final-page {
display: none;
flex-direction: column;
gap: 15px;
animation: fadeIn 0.8s ease;
}

.final-page img {
width: 100%;
border-radius: 15px;
}

#muteBtn {
display: none;
position: fixed;
top: 15px;
right: 15px;
background: white;
border: none;
border-radius: 50%;
width: 48px;
height: 48px;
font-size: 20px;
cursor: pointer;
box-shadow: 0 10px 20px rgba(0,0,0,0.2);
z-index: 1000;
}

#confetti {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 999;
}

@keyframes fadeIn {
from { opacity: 0; transform: scale(0.95); }
to { opacity: 1; transform: scale(1); }
}

/* HEART-SHAPED FLOATING PHOTOS */
.memory-photo {
position: fixed;
object-fit: cover;
clip-path: path(
"M50 15
C35 -5 0 10 0 40
C0 75 50 95 50 95
C50 95 100 75 100 40
C100 10 65 -5 50 15Z"
);
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
opacity: 0;
animation: popIn 0.6s ease forwards, float 6s ease-in-out infinite;
z-index: 5;
cursor: pointer;
}

/* POP IN */
@keyframes popIn {
to {
opacity: 1;
transform: scale(1);
}
}

/* FLOATING MOTION */
@keyframes float {
0% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(-12px) rotate(2deg); }
100% { transform: translateY(0) rotate(0deg); }
}

/* FULLSCREEN OVERLAY */
#photoOverlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: rgba(0,0,0,0.75);
display: none;
justify-content: center;
align-items: center;
z-index: 2000;
}

#photoOverlay img {
max-width: 85%;
max-height: 85%;
border-radius: 16px;
box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

</style>
</head>
<body>

<!-- CONFETTI -->
<canvas id="confetti"></canvas>

<!-- POPUP PAGE -->
<div class="popup" id="popup">
<h1>Will you be my Valentine? 💘</h1>

<div class="buttons">
<button id="no">No 🙄</button>
<button id="yes">Yes 💖</button>
</div>
</div>

<!-- FINAL PAGE -->
<div class="final-page" id="finalPage">
<h2>Yayyy!!! 🎉💞</h2>
<p>You just made me the happiest person ❤️</p>

<img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdnZlbmg5dWlqNTBvZjZpZXB5OXo5dDNsaDlnMDh4Y2FleGgxNDY4aSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/t3sZxY5zS5B0z5zMIz/giphy.gif" alt="Happy Gif">

<p>Happy Valentine’s Day, my love 🥰</p>
</div>

<!-- AUDIO -->
<audio id="bgMusic">
<source src="music.mp3" type="audio/mpeg">
</audio>

<!-- MUTE BUTTON -->
<button id="muteBtn">🔊</button>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const popup = document.getElementById("popup");
const finalPage = document.getElementById("finalPage");
const music = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");

const memoryPhotos = [
"IMG68.jpeg",
"IMG69.jpeg",
"IMG70.jpeg",
"IMG71.jpeg",
"IMG72.jpeg",
"IMG26.jpeg",
"IMG27.jpeg",
"IMG28.jpeg",
"IMG29.jpeg",
"IMG30.jpeg",
"IMG31.jpeg",
"IMG32.jpeg",
"IMG33.jpeg",
"IMG34.jpeg",
"IMG35.jpeg",
"IMG36.jpeg",
"IMG37.jpeg",
"IMG38.jpeg",
"IMG39.jpeg",
"IMG40.jpeg",
"IMG41.jpeg",
"IMG42.jpeg",
"IMG43.jpeg",
"IMG44.jpeg",
"IMG45.jpeg",
"IMG46.jpeg"
];


/* 🎵 MUSIC CONFIG */
const MUSIC_START_TIME = 5; // seconds
const MUSIC_PLAY_DURATION = 180; // seconds

function isTooCloseToCenter(x, y, size) {
const centerX = window.innerWidth / 2;
const centerY = window.innerHeight / 2;

const safeWidth = 200;
const safeHeight = 260;

return (
x > centerX - safeWidth / 2 - size / 2 &&
x < centerX + safeWidth / 2 - size / 2 &&
y > centerY - safeHeight / 2 - size / 2 &&
y < centerY + safeHeight / 2 - size / 2
);
}

function spawnMemoryPhotos() {
memoryPhotos.forEach((src, index) => {
setTimeout(() => {
const img = document.createElement("img");
img.src = src;
img.className = "memory-photo";

const size = Math.random() * 70 + 90;
img.style.width = size + "px";
img.style.height = size + "px";

let x, y;
let attempts = 0;

do {
x = Math.random() * (window.innerWidth - size);
y = Math.random() * (window.innerHeight - size);
attempts++;
} while (isTooCloseToCenter(x, y, size) && attempts < 15);

img.style.left = x + "px";
img.style.top = y + "px";

const rotation = Math.random() * 30 - 15;
img.style.transform = `scale(0.5) rotate(${rotation}deg)`;

img.addEventListener("click", () => openPhotoOverlay(src));

document.body.appendChild(img);
}, index * 350);
});
}

const overlay = document.getElementById("photoOverlay");
const overlayImg = document.getElementById("overlayImg");

function openPhotoOverlay(src) {
overlayImg.src = src;
overlay.style.display = "flex";
}

overlay.addEventListener("click", (e) => {
if (e.target === overlay) {
overlay.style.display = "none";
overlayImg.src = "";
}
});

let scale = 1;

function moveNoButton() {
const maxX = window.innerWidth - noBtn.offsetWidth;
const maxY = window.innerHeight - noBtn.offsetHeight;

scale = Math.max(0.4, scale - 0.1);

noBtn.style.position = "fixed";
noBtn.style.left = Math.random() * maxX + "px";
noBtn.style.top = Math.random() * maxY + "px";
noBtn.style.transform = `scale(${scale})`;
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", e => {
e.preventDefault();
moveNoButton();
});

yesBtn.addEventListener("click", () => {
popup.style.display = "none";
finalPage.style.display = "flex";

music.currentTime = MUSIC_START_TIME;
music.play();

muteBtn.style.display = "block";
startConfetti();
spawnMemoryPhotos();
  
setTimeout(() => {
music.pause();
}, MUSIC_PLAY_DURATION * 1000);
});

muteBtn.addEventListener("click", () => {
music.muted = !music.muted;
muteBtn.textContent = music.muted ? "🔇" : "🔊";
});

/* 🎊 CONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const colors = ["#ff4d6d", "#ffb3c6", "#ffd6e0", "#ffffff"];
let confetti = [];

function createConfetti() {
confetti = [];
for (let i = 0; i < 150; i++) {
confetti.push({
x: Math.random() * canvas.width,
y: Math.random() * -canvas.height,
r: Math.random() * 6 + 4,
d: Math.random() * 0.5 + 0.5,
color: colors[Math.floor(Math.random() * colors.length)]
});
}
}

function drawConfetti() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
confetti.forEach(p => {
ctx.beginPath();
ctx.fillStyle = p.color;
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fill();
p.y += p.d * 6;
});
}

function startConfetti() {
createConfetti();
const interval = setInterval(drawConfetti, 20);
setTimeout(() => {
clearInterval(interval);
ctx.clearRect(0, 0, canvas.width, canvas.height);
}, 2500);
}

window.addEventListener("resize", () => {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
});
</script>
  
<!-- PHOTO ENLARGE OVERLAY -->
<div id="photoOverlay">
<img id="overlayImg" src="" alt="Memory">
</div>

</body>
</html>
