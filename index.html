<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
        }

        /* POPUP */
        #popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .box {
            background: white;
            padding: 28px;
            border-radius: 18px;
            text-align: center;
            width: 90%;
            max-width: 320px;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            border: none;
            border-radius: 24px;
            margin: 10px;
            cursor: pointer;
        }

        #yes {
            background: #ff4d6d;
            color: white;
        }

        #no {
            background: #ddd;
            position: relative;
        }

        /* FINAL PAGE (UNCHANGED UI) */
        #finalPage {
            display: none;
            position: fixed;
            inset: 0;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            z-index: 1;
        }

            #finalPage img {
                width: 220px;
                max-width: 70%;
                z-index: 10;
            }

        h1, p {
            color: white;
            z-index: 10;
        }

        /* HEART-SHAPED FLOATING PHOTOS */
        .memory-photo {
            position: fixed;
            object-fit: cover;
            clip-path: path( "M50 15 C35 -5 0 10 0 40 C0 75 50 95 50 95 C50 95 100 75 100 40 C100 10 65 -5 50 15Z" );
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            animation: popIn 0.6s ease forwards, float 6s ease-in-out infinite;
            z-index: 5;
            cursor: pointer;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* IMAGE OVERLAY */
        #photoOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

            #photoOverlay img {
                max-width: 85%;
                max-height: 85%;
                border-radius: 16px;
            }

        /* MUTE BUTTON */
        #muteBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border-radius: 50%;
            padding: 10px 14px;
            display: none;
            z-index: 1500;
        }
    </style>
</head>

<body>

    <!-- POPUP -->
    <div id="popup">
        <div class="box">
            <h2>Will you be my Valentine? 💖</h2>
            <button id="yes">Sure ❤️</button>
            <button id="no">No 😅</button>
        </div>
    </div>

    <!-- FINAL PAGE -->
    <div id="finalPage">
        <h1>YAYYYY!!! 💕</h1>
        <p>You just made me the happiest person 🥰</p>
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdnZlbmg5dWlqNTBvZjZpZXB5OXo5dDNsaDlnMDh4Y2FleGgxNDY4aSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/t3sZxY5zS5B0z5zMIz/giphy.gif" alt="Happy Gif">
    </div>

    <!-- IMAGE OVERLAY -->
    <div id="photoOverlay">
        <img id="overlayImg">
    </div>

    <audio id="bgMusic" src="music.mp3"></audio>
    <button id="muteBtn">🔊</button>

    <script>
        const yesBtn = document.getElementById("yes");
        const noBtn = document.getElementById("no");
        const popup = document.getElementById("popup");
        const finalPage = document.getElementById("finalPage");
        const music = document.getElementById("bgMusic");
        const muteBtn = document.getElementById("muteBtn");

        const MUSIC_START_TIME = 5;
        const MUSIC_PLAY_DURATION = 180;

        const memoryPhotos = [
            "IMG68.jpeg",
            "IMG69.jpeg",
            "IMG70.jpeg",
            "IMG71.jpeg",
            "IMG72.jpeg",
            "IMG26.jpeg",
            "IMG27.jpeg",
            "IMG28.jpeg",
            "IMG29.jpeg",
            "IMG30.jpeg",
            "IMG31.jpeg",
            "IMG32.jpeg",
            "IMG33.jpeg",
            "IMG34.jpeg",
            "IMG35.jpeg",
            "IMG36.jpeg",
            "IMG37.jpeg",
            "IMG38.jpeg",
            "IMG39.jpeg",
            "IMG40.jpeg",
            "IMG41.jpeg",
            "IMG42.jpeg",
            "IMG43.jpeg",
            "IMG44.jpeg",
            "IMG45.jpeg",
            "IMG46.jpeg"
        ];

        /* NO BUTTON DODGE (UNCHANGED) */
        function dodge() {
            const x = Math.random() * 150 - 75;
            const y = Math.random() * 150 - 75;
            noBtn.style.transform = `translate(${x}px, ${y}px) scale(0.8)`;
        }
        noBtn.addEventListener("mouseover", dodge);
        noBtn.addEventListener("touchstart", dodge);

        /* KEEP PHOTOS AWAY FROM CENTER GIF */
        function isTooCloseToCenter(x, y, size) {
            const cx = innerWidth / 2;
            const cy = innerHeight / 2;
            return (
                x > cx - 140 &&
                x < cx + 140 &&
                y > cy - 200 &&
                y < cy + 200
            );
        }

        /* SPAWN FLOATING HEART PHOTOS */
        function spawnMemoryPhotos() {
            memoryPhotos.forEach((src, i) => {
                setTimeout(() => {
                    const img = document.createElement("img");
                    img.src = src;
                    img.className = "memory-photo";

                    const size = Math.random() * 70 + 90;
                    img.style.width = size + "px";
                    img.style.height = size + "px";

                    let x, y;
                    do {
                        x = Math.random() * (innerWidth - size);
                        y = Math.random() * (innerHeight - size);
                    } while (isTooCloseToCenter(x, y, size));

                    img.style.left = x + "px";
                    img.style.top = y + "px";

                    img.onclick = () => openOverlay(src);
                    document.body.appendChild(img);
                }, i * 350);
            });
        }

        /* TAP TO ENLARGE */
        const overlay = document.getElementById("photoOverlay");
        const overlayImg = document.getElementById("overlayImg");

        function openOverlay(src) {
            overlayImg.src = src;
            overlay.style.display = "flex";
        }

        overlay.onclick = e => {
            if (e.target === overlay) {
                overlay.style.display = "none";
                overlayImg.src = "";
            }
        };

        /* CONFETTI */
        function startConfetti() {
            for (let i = 0; i < 80; i++) {
                const c = document.createElement("div");
                c.style.position = "fixed";
                c.style.width = "8px";
                c.style.height = "8px";
                c.style.background = `hsl(${Math.random() * 360},100%,70%)`;
                c.style.left = Math.random() * 100 + "vw";
                c.style.top = "-10px";
                c.style.animation = "fall 3s linear";
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        /* YES CLICK (UNCHANGED FLOW + PHOTOS ADDED) */
        yesBtn.onclick = () => {
            popup.style.display = "none";
            finalPage.style.display = "flex";

            music.currentTime = MUSIC_START_TIME;
            music.play();
            muteBtn.style.display = "block";

            startConfetti();
            spawnMemoryPhotos();

            setTimeout(() => music.pause(), MUSIC_PLAY_DURATION * 1000);
        };

        muteBtn.onclick = () => {
            music.muted = !music.muted;
            muteBtn.textContent = music.muted ? "🔇" : "🔊";
        };
    </script>

</body>
</html>
