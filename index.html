<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine ❤️</title>

    <style>
        body {
margin: 0;
height: 100vh;
background: linear-gradient(135deg, #ff9a9e, #fad0c4);
font-family: 'Segoe UI', sans-serif;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}

        /* POPUP */
        .popup, .final-page {
background: white;
padding: 25px;
border-radius: 20px;
text-align: center;
box-shadow: 0 20px 40px rgba(0,0,0,0.2);
width: 90%;
max-width: 360px;
}

        .box {
            background: white;
padding: 25px;
border-radius: 20px;
text-align: center;
box-shadow: 0 20px 40px rgba(0,0,0,0.2);
width: 90%;
max-width: 360px;
        }

        .buttons {
margin-top: 25px;
position: relative;
height: 120px;
}

button {
padding: 14px 30px;
border: none;
border-radius: 30px;
font-size: 16px;
cursor: pointer;
position: absolute;
transition: all 0.2s ease;
}

        #yes {
background: #ff4d6d;
color: white;
left: 50%;
transform: translateX(-50%);
bottom: 0;
        }

        #no {
background: #ddd;
color: #333;
left: 50%;
transform: translateX(-50%);
top: 0;
        }

        /* FINAL PAGE (UNCHANGED UI) */
       .final-page {
display: none;
flex-direction: column;
gap: 15px;
animation: fadeIn 0.8s ease;
}

.final-page img {
width: 100%;
border-radius: 15px;
}

       h1, h2 {
color: #ff4d6d;
}

p {
color: #444;
font-size: 16px;
}

        /* HEART-SHAPED FLOATING PHOTOS */
        .memory-photo {
            position: fixed;
            object-fit: cover;
            clip-path: path( "M50 15 C35 -5 0 10 0 40 C0 75 50 95 50 95 C50 95 100 75 100 40 C100 10 65 -5 50 15Z" );
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            animation: popIn 0.6s ease forwards, float 6s ease-in-out infinite;
            z-index: 5;
            cursor: pointer;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* IMAGE OVERLAY */
        #photoOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

            #photoOverlay img {
                max-width: 85%;
                max-height: 85%;
                border-radius: 16px;
            }

        /* MUTE BUTTON */
        #muteBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border-radius: 50%;
            padding: 10px 14px;
            display: none;
            z-index: 1500;
        }
        
#confetti {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 999;
}

@keyframes fadeIn {
from { opacity: 0; transform: scale(0.95); }
to { opacity: 1; transform: scale(1); }
}
    </style>
</head>

<body>

    <!-- CONFETTI -->
<canvas id="confetti"></canvas>
    <!-- POPUP -->
    <div id="popup">
        <div class="box">
            <h2>Will you be my Valentine? 💖</h2>
            <button id="yes">Sure ❤️</button>
            <button id="no">No 😅</button>
        </div>
    </div>

<!-- FINAL PAGE -->
<div class="final-page" id="finalPage">
<h2>Yayyy!!! 🎉💞</h2>
<p>You just made me the happiest person ❤️</p>

<img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdnZlbmg5dWlqNTBvZjZpZXB5OXo5dDNsaDlnMDh4Y2FleGgxNDY4aSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/t3sZxY5zS5B0z5zMIz/giphy.gif" alt="Happy Gif">

<p>Happy Valentine’s Day, my love 🥰</p>
</div>

    <!-- IMAGE OVERLAY -->
    <div id="photoOverlay">
        <img id="overlayImg">
    </div>

    <audio id="bgMusic" src="music.mp3"></audio>
    <button id="muteBtn">🔊</button>

    <script>
        const yesBtn = document.getElementById("yes");
        const noBtn = document.getElementById("no");
        const popup = document.getElementById("popup");
        const finalPage = document.getElementById("finalPage");
        const music = document.getElementById("bgMusic");
        const muteBtn = document.getElementById("muteBtn");

        const MUSIC_START_TIME = 5;
        const MUSIC_PLAY_DURATION = 180;

        const memoryPhotos = [
            "IMG68.jpeg",
            "IMG69.jpeg",
            "IMG70.jpeg",
            "IMG71.jpeg",
            "IMG72.jpeg",
            "IMG26.jpeg",
            "IMG27.jpeg",
            "IMG28.jpeg",
            "IMG29.jpeg",
            "IMG30.jpeg",
            "IMG31.jpeg",
            "IMG32.jpeg",
            "IMG33.jpeg",
            "IMG34.jpeg",
            "IMG35.jpeg",
            "IMG36.jpeg",
            "IMG37.jpeg",
            "IMG38.jpeg",
            "IMG39.jpeg",
            "IMG40.jpeg",
            "IMG41.jpeg",
            "IMG42.jpeg",
            "IMG43.jpeg",
            "IMG44.jpeg",
            "IMG45.jpeg",
            "IMG46.jpeg"
        ];

        let scale = 1;
        /* NO BUTTON DODGE (UNCHANGED) */
        function dodge() {
            const maxX = window.innerWidth - noBtn.offsetWidth;
const maxY = window.innerHeight - noBtn.offsetHeight;

scale = Math.max(0.4, scale - 0.1);
            noBtn.style.position = "fixed";
noBtn.style.left = Math.random() * maxX + "px";
noBtn.style.top = Math.random() * maxY + "px";
noBtn.style.transform = `scale(${scale})`;
        }
        noBtn.addEventListener("mouseover", dodge);
        noBtn.addEventListener("touchstart", e => {
e.preventDefault();
            dodge()});

        /* KEEP PHOTOS AWAY FROM CENTER GIF */
        function isTooCloseToCenter(x, y, size) {
            const cx = innerWidth / 2;
            const cy = innerHeight / 2;
            return (
                x > cx - 140 &&
                x < cx + 140 &&
                y > cy - 200 &&
                y < cy + 200
            );
        }

        /* SPAWN FLOATING HEART PHOTOS */
        function spawnMemoryPhotos() {
            memoryPhotos.forEach((src, i) => {
                setTimeout(() => {
                    const img = document.createElement("img");
                    img.src = src;
                    img.className = "memory-photo";

                    const size = Math.random() * 70 + 90;
                    img.style.width = size + "px";
                    img.style.height = size + "px";

                    let x, y;
                    do {
                        x = Math.random() * (innerWidth - size);
                        y = Math.random() * (innerHeight - size);
                    } while (isTooCloseToCenter(x, y, size));

                    img.style.left = x + "px";
                    img.style.top = y + "px";

                    img.onclick = () => openOverlay(src);
                    document.body.appendChild(img);
                }, i * 350);
            });
        }

        /* TAP TO ENLARGE */
        const overlay = document.getElementById("photoOverlay");
        const overlayImg = document.getElementById("overlayImg");

        function openOverlay(src) {
            overlayImg.src = src;
            overlay.style.display = "flex";
        }

        overlay.onclick = e => {
            if (e.target === overlay) {
                overlay.style.display = "none";
                overlayImg.src = "";
            }
        };

        /* CONFETTI */
        function startConfetti() {
            for (let i = 0; i < 80; i++) {
                const c = document.createElement("div");
                c.style.position = "fixed";
                c.style.width = "8px";
                c.style.height = "8px";
                c.style.background = `hsl(${Math.random() * 360},100%,70%)`;
                c.style.left = Math.random() * 100 + "vw";
                c.style.top = "-10px";
                c.style.animation = "fall 3s linear";
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        /* YES CLICK (UNCHANGED FLOW + PHOTOS ADDED) */
        yesBtn.onclick = () => {
            popup.style.display = "none";
            finalPage.style.display = "flex";

            music.currentTime = MUSIC_START_TIME;
            music.play();
            muteBtn.style.display = "block";

            startConfetti();
            spawnMemoryPhotos();

            setTimeout(() => music.pause(), MUSIC_PLAY_DURATION * 1000);
        };

        muteBtn.onclick = () => {
            music.muted = !music.muted;
            muteBtn.textContent = music.muted ? "🔇" : "🔊";
        };
    </script>

</body>
</html>
